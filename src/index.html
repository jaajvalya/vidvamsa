<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>Vidvamsa | Technology Services &amp; AI Automation</title>
  <meta name="description" content="Vidvamsa delivers technology consulting, AI automation and digital transformation solutions with expert Designers, Architects and Engineers." />
  <meta name="keywords"    content="Technology Services, AI Automation, Digital Transformation, Software Engineering, Cloud Architecture" />
  <meta name="author"      content="Vidvamsa" />
  <meta name="robots"      content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://vidvamsa.tech/" />
  <meta property="og:title"       content="Vidvamsa | Technology Services &amp; AI Automation" />
  <meta property="og:description" content="End-to-end technology services powered by AI. Expert Designers, Architects and Engineers." />

  <!-- Favicon — IBM Blue square with V -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F62FE'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23FFFFFF' font-size='18' font-family='IBM Plex Sans,system-ui' font-weight='700'%3EV%3C/text%3E%3C/svg%3E" />

  <!-- Preconnect for IBM Plex fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Main stylesheet (imports fonts, tokens, layout, components) -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- Skip to main content (accessibility) -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ═══════════════════════════════════════════
       TOP NAVIGATION BAR — IBM.com style
       Rendered by src/js/navigation.js
       ═══════════════════════════════════════════ -->
  <header id="topbar" class="topbar" role="banner">
    <!-- Injected by navigation.js -->
  </header>

  <!-- Mobile navigation drawer (injected by navigation.js) -->
  <nav id="mobile-nav" class="topbar__mobile-nav" aria-label="Mobile navigation" hidden></nav>

  <!-- ═══════════════════════════════════════════
       MAIN CONTENT — full-width below topbar
       ═══════════════════════════════════════════ -->
  <main id="main-content" class="main-content" tabindex="-1">

    <!-- Home -->
    <div
      id="section-home"
      class="page-section"
      data-section="home"
      role="region"
      aria-label="Home"
    ></div>

    <!-- Services -->
    <div
      id="section-services"
      class="page-section"
      data-section="services"
      role="region"
      aria-label="Services"
    ></div>

    <!-- Support -->
    <div
      id="section-support"
      class="page-section"
      data-section="support"
      role="region"
      aria-label="Support"
    ></div>

    <!-- Contact -->
    <div
      id="section-contact"
      class="page-section"
      data-section="contact"
      role="region"
      aria-label="Contact Us"
    ></div>

  </main>

  <!-- ═══════════════════════════════════════════
       JAVASCRIPT — ES Modules entry point
       ═══════════════════════════════════════════ -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
