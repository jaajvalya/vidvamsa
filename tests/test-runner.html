<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidvamsa — Test Runner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1a202c;
      min-height: 100vh;
    }

    .header {
      background: #0F2D54;
      color: #E8F4FD;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #00A8E8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
    }

    .header__title {
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .header__subtitle {
      font-size: 12px;
      color: #94B8D8;
      margin-top: 2px;
    }

    .header__badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 168, 232, 0.2);
      color: #00A8E8;
      border: 1px solid rgba(0, 168, 232, 0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .notice {
      background: #fffde7;
      border: 1px solid #f9a825;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #6d4c00;
      margin-bottom: 24px;
    }

    .notice strong { color: #e65100; }

    .notice code {
      background: rgba(0,0,0,0.06);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    #report {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #report p {
      color: #6b7280;
      font-style: italic;
      padding: 32px 0;
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #0077CC;
      color: white;
    }

    .btn-primary:hover { background: #005fa3; }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .btn-secondary:hover { background: #e5e7eb; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header__brand">
      <div class="header__mark">V</div>
      <div>
        <div class="header__title">Vidvamsa</div>
        <div class="header__subtitle">Test Suite</div>
      </div>
    </div>
    <span class="header__badge">Unit &amp; Integration Tests</span>
  </div>

  <div class="content">

    <div class="notice">
      <strong>⚠ Requires HTTP server.</strong>
      ES Modules cannot load over <code>file://</code>. Run:
      <code>npx serve .</code> or <code>python3 -m http.server</code> from the
      project root, then open <code>http://localhost:PORT/tests/test-runner.html</code>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="location.reload()">
        ↺ Re-run all tests
      </button>
      <a class="btn btn-secondary" href="../src/index.html">
        ← Back to site
      </a>
    </div>

    <div id="report">
      <p>Loading test suite…</p>
    </div>

  </div>

  <!--
    Tests are in tests/tests.js.
    They import from ../src/js/* using ES module relative paths.
    The runner must be served over HTTP for modules to resolve.
  -->
  <script type="module" src="tests.js"></script>

</body>
</html>
